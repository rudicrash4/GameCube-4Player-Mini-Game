<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Game 1 - GameCube 4Player</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 1. MENU PILIHAN PEMAIN (Player Selection Menu - Portrait Minimalis) -->
    <section id="player-select-view" class="view active">
      <div class="player-select-card">
        <h1 class="select-title">PILIH JUMLAH PEMAIN</h1>
        <p class="select-subtitle">Game 1: 3D Cube Arena</p>

        <!-- Kotak Sederhana Minimalis Warna Solid -->
        <div class="player-buttons-grid">
          <button type="button" class="btn-player btn-disabled" data-players="1" disabled>
            <span class="player-num">1P</span>
            <span class="player-status">Belum Tersedia</span>
          </button>
          <button type="button" class="btn-player btn-disabled" data-players="2" disabled>
            <span class="player-num">2P</span>
            <span class="player-status">Belum Tersedia</span>
          </button>
          <button type="button" class="btn-player btn-disabled" data-players="3" disabled>
            <span class="player-num">3P</span>
            <span class="player-status">Belum Tersedia</span>
          </button>
          <button type="button" id="btn-mode-4p" class="btn-player btn-active-4p" data-players="4">
            <span class="player-num">4P</span>
            <span class="player-status">Mulai</span>
          </button>
        </div>

        <button type="button" id="btn-back-to-main" class="btn-back-menu">
          &larr; Kembali ke Menu Utama
        </button>
      </div>
    </section>

    <!-- 2. ARENA GAMEPLAY 3D (Area Landscape di dalam Layar Portrait) -->
    <section id="gameplay-view" class="view hidden">
      <div class="landscape-game-wrapper">
        <!-- Top Bar Navigasi Arena -->
        <div class="game-hud-top">
          <button type="button" id="btn-exit-game" class="hud-btn">
            &larr; Pilih Pemain
          </button>
          <div class="game-hud-title">4P 3D ARENA</div>
          <button type="button" id="btn-reset-positions" class="hud-btn">
            Reset
          </button>
        </div>

        <!-- Area Gameplay Landscape -->
        <div id="landscape-stage" class="landscape-stage">
          <!-- WebGL Three.js Container -->
          <div id="three-container"></div>

          <!-- 4 BUAH SVG JOYSTICK DI 4 SUDUT AREA GAMEPLAY LANDSCAPE -->
          <!-- Sudut Kiri-Atas: Player 3 (Hijau #22c55e) -->
          <div id="joystick-p3" class="joystick-zone top-left" data-player="p3">
            <svg class="joystick-svg" viewBox="0 0 100 100">
              <circle class="joy-outer" cx="50" cy="50" r="46" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="2.5" />
              <circle class="joy-inner" cx="50" cy="50" r="22" fill="#22c55e" fill-opacity="0.85" />
            </svg>
          </div>

          <!-- Sudut Kanan-Atas: Player 4 (Kuning #eab308) -->
          <div id="joystick-p4" class="joystick-zone top-right" data-player="p4">
            <svg class="joystick-svg" viewBox="0 0 100 100">
              <circle class="joy-outer" cx="50" cy="50" r="46" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="2.5" />
              <circle class="joy-inner" cx="50" cy="50" r="22" fill="#eab308" fill-opacity="0.85" />
            </svg>
          </div>

          <!-- Sudut Kiri-Bawah: Player 1 (Merah #ef4444) -->
          <div id="joystick-p1" class="joystick-zone bottom-left" data-player="p1">
            <svg class="joystick-svg" viewBox="0 0 100 100">
              <circle class="joy-outer" cx="50" cy="50" r="46" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="2.5" />
              <circle class="joy-inner" cx="50" cy="50" r="22" fill="#ef4444" fill-opacity="0.85" />
            </svg>
          </div>

          <!-- Sudut Kanan-Bawah: Player 2 (Biru #3b82f6) -->
          <div id="joystick-p2" class="joystick-zone bottom-right" data-player="p2">
            <svg class="joystick-svg" viewBox="0 0 100 100">
              <circle class="joy-outer" cx="50" cy="50" r="46" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2.5" />
              <circle class="joy-inner" cx="50" cy="50" r="22" fill="#3b82f6" fill-opacity="0.85" />
            </svg>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="./script.js"></script>
  </body>
</html>
