<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>GameCube 4Player Mini Game</title>
    <meta
      name="description"
      content="Template web HTML5 fullscreen untuk GameCube 4Player Mini Game dengan layout landscape dan menu grid game."
    />
    <meta property="og:title" content="GameCube 4Player Mini Game" />
    <meta
      property="og:description"
      content="Template web HTML5 fullscreen untuk GameCube 4Player Mini Game dengan layout landscape dan menu grid game."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- 1. HALAMAN AWAL (Initial Page) -->
    <div id="initial-screen" class="screen active">
      <!-- Tombol Aksi Kontrol Tampilan (Rotasi & Fullscreen) -->
      <div class="top-controls">
        <button id="btn-rotate" type="button" class="ctrl-btn" title="Rotasi Tampilan">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.19"/>
          </svg>
          <span>Rotasi</span>
        </button>
        <button id="btn-fullscreen" type="button" class="ctrl-btn" title="Layar Penuh">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
          <span>Fullscreen</span>
        </button>
      </div>

      <!-- Tombol Utama Tengah -->
      <button id="btn-permainan" type="button" class="btn-permainan">
        PERMAINAN
      </button>
    </div>

    <!-- 2. MENU GAME (Game Menu Page) -->
    <div id="game-menu-screen" class="screen hidden">
      <div class="menu-top-bar">
        <button id="btn-back-to-initial" type="button" class="btn-back">
          &larr; Kembali
        </button>
      </div>
      <div class="menu-scroll-container">
        <div id="game-grid" class="game-grid">
          <!-- Kotak game 1 dan slot lainnya akan di-render melalui script.js -->
        </div>
      </div>
    </div>

    <script src="/script.js"></script>
  </body>
</html>
