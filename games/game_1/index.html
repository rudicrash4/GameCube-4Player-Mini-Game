<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Game 1 - GameCube 4Player</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- 1. MENU PILIHAN PEMAIN (Player Selection Menu) -->
    <section id="player-select-view" class="view active">
      <div class="player-select-card">
        <h1 class="select-title">PILIH JUMLAH PEMAIN</h1>
        <p class="select-subtitle">Game 1: 4-Player Arena Battle</p>

        <div class="player-buttons-grid">
          <button type="button" class="btn-player btn-disabled" data-players="1" disabled>
            <span class="player-num">1P</span>
            <span class="player-status">Segera Hadir</span>
          </button>
          <button type="button" class="btn-player btn-disabled" data-players="2" disabled>
            <span class="player-num">2P</span>
            <span class="player-status">Segera Hadir</span>
          </button>
          <button type="button" class="btn-player btn-disabled" data-players="3" disabled>
            <span class="player-num">3P</span>
            <span class="player-status">Segera Hadir</span>
          </button>
          <button type="button" id="btn-mode-4p" class="btn-player btn-active-4p" data-players="4">
            <span class="player-num">4P</span>
            <span class="player-status">Main Sekarang</span>
          </button>
        </div>

        <button type="button" id="btn-back-to-main" class="btn-back-menu">
          &larr; Kembali ke Menu Utama
        </button>
      </div>
    </section>

    <!-- 2. ARENA GAMEPLAY (4 Players & 4 Corner Joysticks) -->
    <section id="gameplay-view" class="view hidden">
      <!-- Game Canvas untuk 4 Pemain -->
      <canvas id="game-canvas"></canvas>

      <!-- Bar Kontrol Atas Arena -->
      <div class="game-hud-top">
        <button type="button" id="btn-exit-game" class="hud-btn">
          &larr; Pilih Pemain
        </button>
        <div class="game-hud-title">4P ARENA</div>
        <button type="button" id="btn-reset-positions" class="hud-btn">
          Reset Posisi
        </button>
      </div>

      <!-- 4 BUAH JOYSTICK DI 4 SUDUT LAYAR -->
      <!-- Sudut Kiri-Atas: Player 3 (Hijau) -->
      <div id="joystick-p3" class="joystick-zone top-left p3-theme" data-player="p3">
        <div class="joystick-label">P3</div>
        <div class="joystick-base">
          <div class="joystick-knob"></div>
        </div>
      </div>

      <!-- Sudut Kanan-Atas: Player 4 (Kuning) -->
      <div id="joystick-p4" class="joystick-zone top-right p4-theme" data-player="p4">
        <div class="joystick-label">P4</div>
        <div class="joystick-base">
          <div class="joystick-knob"></div>
        </div>
      </div>

      <!-- Sudut Kiri-Bawah: Player 1 (Merah) -->
      <div id="joystick-p1" class="joystick-zone bottom-left p1-theme" data-player="p1">
        <div class="joystick-label">P1</div>
        <div class="joystick-base">
          <div class="joystick-knob"></div>
        </div>
      </div>

      <!-- Sudut Kanan-Bawah: Player 2 (Biru) -->
      <div id="joystick-p2" class="joystick-zone bottom-right p2-theme" data-player="p2">
        <div class="joystick-label">P2</div>
        <div class="joystick-base">
          <div class="joystick-knob"></div>
        </div>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
