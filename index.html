<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D12">
  <title>4 Player Party Arena</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="rotated-stage">
    <section id="menu-view" class="view">
      <div id="game-grid" aria-label="Daftar mini-game"></div>
    </section>

    <section id="game-view" class="view" hidden>
      <iframe id="game-frame" title="Mini-game" allow="fullscreen; autoplay"></iframe>
      <button id="back-button" type="button" aria-label="Kembali ke menu">‹</button>
      <div id="controls-layer" aria-label="Kontrol pemain"></div>
    </section>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
